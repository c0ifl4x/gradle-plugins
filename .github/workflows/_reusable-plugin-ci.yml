name: Reusable CI/CD workflow for plugins publishing

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
    secrets:
      REPOSILITE_USER:
        required: true
      REPOSILITE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build, test & publish ${{ inputs.module }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks and tests
        run: ./gradlew :${{ inputs.module }}:check --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.module }}-test-reports
          path: ${{ inputs.module }}/build/reports/tests/
          retention-days: 7

      - name: Publish to Reposilite
        if: github.event_name != 'pull_request'
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew :${{ inputs.module }}:publish --no-daemon
